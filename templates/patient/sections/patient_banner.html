{% load static %}

<section class="md-banner shadow-panel">

    <span class="md-banner__ring"></span>

    <div class="md-banner__inner">

        <div class="md-brand">

            <span class="md-brand__mark">
                <img
                    src="{% static 'images/logo_textless.webp' %}"
                    alt="Medicare"
                >
            </span>

            <span class="md-brand__name">
                Medicare
            </span>

        </div>

        <div>

            <p class="md-banner__name">
                {{ patient.name }}
            </p>

            <div class="md-banner__meta">
                <span>
                    ID: {{ patient.patient_id }}
                </span>

                <span>
                    {{ patient.blood_type }} Blood Type
                </span>
            </div>

        </div>

    </div>

</section>
