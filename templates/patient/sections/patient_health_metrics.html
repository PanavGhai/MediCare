{% load static %}

<section class="md-metrics">

    <div class="md-metric-card">
        <span class="md-metric-card__icon">
            <i data-lucide="activity" width="16" height="16"></i>
        </span>

        <p class="md-metric-card__label">
            Blood Sugar
        </p>

        <p class="md-metric-card__value">
            {{ health_metrics.blood_sugar.value }}
            <span>{{ health_metrics.blood_sugar.unit }}</span>
        </p>
    </div>

    <div class="md-metric-card">
        <span class="md-metric-card__icon">
            <i data-lucide="weight" width="16" height="16"></i>
        </span>

        <p class="md-metric-card__label">
            Body Weight
        </p>

        <p class="md-metric-card__value">
            {{ health_metrics.body_weight.value }}
            <span>{{ health_metrics.body_weight.unit }}</span>
        </p>
    </div>

    <div class="md-metric-card">
        <span class="md-metric-card__icon">
            <i data-lucide="thermometer" width="16" height="16"></i>
        </span>

        <p class="md-metric-card__label">
            Temperature
        </p>

        <p class="md-metric-card__value">
            {{ health_metrics.temperature.value }}
            <span>{{ health_metrics.temperature.unit }}</span>
        </p>
    </div>

</section>
